# Compose interpolation (${VAR}) reads the project `.env` / the shell — NOT env_file.
# Copy `.env.example` → `.env` for passwords used below. Copy `config.env.example` → `config.env`
# for in-container settings (JWT, LLM keys, CORS). `environment:` overrides `env_file`.
#
# DATABASE_URL here is built from `.env` DB_PASSWORD. A DATABASE_URL in config.env is ignored.
# Langfuse: docker compose -f docker-compose.prod.yml -f docker-compose.langfuse.yml
#   plus NGINX_CONF=./deploy/nginx.langfuse.conf — do not put ${LANGFUSE_*:?} in this file.

x-nexus-env: &nexus-env
  ENVIRONMENT: production
  CORS_ALLOW_ALL: "false"
  LLM_PROVIDER: openai
  DATABASE_URL: postgresql://nexusai:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/nexusai
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
  USE_SQLITE_FALLBACK: "0"

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    environment:
      POSTGRES_DB: nexusai
      POSTGRES_USER: nexusai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusai -d nexusai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # One-shot. Do not also alembic from API/workers (lock race).
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: config.env
    environment:
      <<: *nexus-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  nexusai:
    build: .
    env_file: config.env
    environment:
      <<: *nexus-env
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      # Tier A: set UVICORN_WORKERS=1 THREAD_POOL_MAX_WORKERS=16 in project .env
      UVICORN_WORKERS: "${UVICORN_WORKERS:-2}"
      THREAD_POOL_MAX_WORKERS: "${THREAD_POOL_MAX_WORKERS:-64}"
      LLM_CONCURRENCY_LIMIT: "${LLM_CONCURRENCY_LIMIT:-16}"
      LLM_BUCKET_LIMIT: "${LLM_BUCKET_LIMIT:-8}"
      LLM_CONCURRENCY_ACQUIRE_TIMEOUT_S: "${LLM_CONCURRENCY_ACQUIRE_TIMEOUT_S:-5}"
      INTENT_MODEL_PATH: /app/data/models/intent_v8
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data/models/intent_v8:/app/data/models/intent_v8:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  memory-worker:
    build: .
    command: ["python", "-m", "apps.memory_worker"]
    healthcheck:
      test: ["CMD", "python", "scripts/worker_liveness.py", "memory"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file: config.env
    environment:
      <<: *nexus-env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always

  social-worker:
    build: .
    command: ["python", "-m", "apps.social_worker"]
    healthcheck:
      test: ["CMD", "python", "scripts/worker_liveness.py", "social"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file: config.env
    environment:
      <<: *nexus-env
      TIKHUB_API_KEY: ${TIKHUB_API_KEY:-}
      SOCIAL_TIKHUB_QPS: ${SOCIAL_TIKHUB_QPS:-2}
      SOCIAL_TIKHUB_BURST: ${SOCIAL_TIKHUB_BURST:-4}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ${NGINX_CONF:-./deploy/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx-boot.sh:/nginx-boot.sh:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    command: ["sh", "/nginx-boot.sh"]
    depends_on:
      - nexusai
    restart: always

volumes:
  pgdata:
  redis_data:
