services:
  # 后端API服务
  nexusai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://nexusai:nexusai_password@postgres:5432/nexusai
      - DB_TYPE=postgresql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-nexusai_redis}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      - UVICORN_WORKERS=2
      - USE_SQLITE_FALLBACK=0
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexusai_network

  # PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nexusai
      POSTGRES_USER: nexusai
      POSTGRES_PASSWORD: nexusai_password
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./backend/database/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusai -d nexusai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - nexusai_network

  # Redis 业务缓存/队列（G5：认证 + maxmemory + AOF；禁与 langfuse 共用）
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-nexusai_redis}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nexusai_redis}", "ping"]
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - nexusai_network

  # G2：记忆 Streams worker
  memory-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "apps.memory_worker"]
    healthcheck:
      test: ["CMD", "python", "scripts/worker_liveness.py", "memory"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://nexusai:nexusai_password@postgres:5432/nexusai
      - DB_TYPE=postgresql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-nexusai_redis}
      - USE_SQLITE_FALLBACK=0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexusai_network

  # Task 52：社媒对标 worker（SKIP LOCKED）
  social-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "apps.social_worker"]
    healthcheck:
      test: ["CMD", "python", "scripts/worker_liveness.py", "social"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://nexusai:nexusai_password@postgres:5432/nexusai
      - DB_TYPE=postgresql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-nexusai_redis}
      - TIKHUB_API_KEY=${TIKHUB_API_KEY:-}
      - SOCIAL_TIKHUB_QPS=${SOCIAL_TIKHUB_QPS:-2}
      - SOCIAL_TIKHUB_BURST=${SOCIAL_TIKHUB_BURST:-4}
      - USE_SQLITE_FALLBACK=0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexusai_network

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF:-./deploy/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx-boot.sh:/nginx-boot.sh:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    command: ["sh", "/nginx-boot.sh"]
    depends_on:
      - nexusai
    restart: unless-stopped
    networks:
      - nexusai_network

  # 监控服务
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - nexusai_network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - nexusai_network

