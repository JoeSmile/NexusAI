name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: contextgate
          POSTGRES_USER: contextgate
          POSTGRES_PASSWORD: contextgate_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextgate -d contextgate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check backend/ scripts/ --output-format=github

      - name: MyPy type check
        # 使用 pyproject files + overrides（勿传 backend/，否则会绕过 files 收敛）
        run: uv run mypy --ignore-missing-imports

      - name: Init database
        run: |
          uv run python -c "from backend.database.pgvector_session import PGVectorSession; PGVectorSession().init_db()"
        env:
          DATABASE_URL: postgresql://contextgate:contextgate_local@localhost:5432/contextgate
          LLM_MOCK: "true"

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://contextgate:contextgate_local@localhost:5432/contextgate
          LLM_MOCK: "true"
