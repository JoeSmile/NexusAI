scenario: "工作焦虑"
description: "用户因工作压力大感到焦虑"
turns:
  - user: "最近项目压力好大"
    emotion: "焦虑"
    intensity: 8
    intent: "emotion"
    response: "听起来你最近工作压力很大。能具体说说是什么样的项目吗？"
  - user: "天天加班到12点"
    emotion: "焦虑"
    intensity: 9
    intent: "emotion"
    response: "长期加班确实对身体和心情都不好。你有多久没有好好休息了？"
  - user: "感觉快撑不住了"
    emotion: "无助"
    intensity: 9
    intent: "emotion"
    response: "这种感觉确实很难受。要不要试试跟领导沟通一下工作安排？"
