<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>意图识别 — Intent 用例</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #0f172a; color: #e2e8f0; max-width: 800px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; color: #38bdf8; }
  .desc { background: #1e293b; border-left: 3px solid #38bdf8; padding: 12px 16px; border-radius: 4px; font-size: 13px; line-height: 1.7; }
  label { display: block; margin: 16px 0 6px; font-size: 13px; color: #94a3b8; }
  input, textarea { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 10px; font-size: 14px; }
  textarea { min-height: 70px; }
  button { background: #0284c7; border: none; color: #fff; padding: 10px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 14px; }
  button:hover { background: #0369a1; }
  pre { background: #0b1220; border: 1px solid #334155; border-radius: 6px; padding: 12px; white-space: pre-wrap; word-break: break-all; font-size: 13px; max-height: 320px; overflow: auto; }
  .hint { font-size: 12px; color: #64748b; margin-top: 6px; }
</style>
</head>
<body>
<h1>意图识别 — /intent/analyze + /detect</h1>
<div class="desc">
  <b>测什么:</b>意图识别模型链路 —— 文本 → 意图分类(内置规则 + LLM 兜底)。<br>
  <b>前置:</b>① config.env 配 <code>LLM_API_KEY</code>/<code>LLM_BASE_URL</code>(对接外部意图模型见 examples/README.md);② X-API-Key(make seed 获取)。<br>
  <b>预期:</b>返回 <code>intent</code> + <code>confidence</code>;企业问题(如"如何查询公司的信息安全管理制度?")应命中 knowledge_query 类意图;LLM_MOCK=true 时返回 mock 结果。
</div>

<label for="apiKey">X-API-Key(留空则用种子 key 的 acme/alice)</label>
<input id="apiKey" placeholder="cg_...">

<label for="text">输入文本(意图样本)</label>
<textarea id="text">如何查询公司的信息安全管理制度？</textarea>

<label>示例样本(点击填入)</label>
<div style="display:flex; gap:8px; flex-wrap:wrap;">
  <button onclick="setSample('如何查询公司的信息安全管理制度？')" style="margin-top:0; padding:6px 12px; font-size:12px; background:#334155;">知识查询</button>
  <button onclick="setSample('帮我生成一份项目周报')" style="margin-top:0; padding:6px 12px; font-size:12px; background:#334155;">任务生成</button>
  <button onclick="setSample('你是谁？')" style="margin-top:0; padding:6px 12px; font-size:12px; background:#334155;">寒暄</button>
  <button onclick="setSample('把这段话改得更正式一点')" style="margin-top:0; padding:6px 12px; font-size:12px; background:#334155;">改写</button>
</div>

<div style="display:flex; gap:12px;">
  <button onclick="call('analyze')">POST /intent/analyze</button>
  <button onclick="call('detect')" style="background:#334155;">POST /intent/detect</button>
  <button onclick="call('types')" style="background:#334155;">GET /intent/types</button>
</div>

<pre id="out">// 结果将显示在这里</pre>

<script>
const BASE = 'http://localhost:8000';
function setSample(t) { document.getElementById('text').value = t; }
function hdrs() {
  const k = document.getElementById('apiKey').value.trim();
  return { 'Content-Type': 'application/json', ...(k ? { 'X-API-Key': k } : {}) };
}
async function call(mode) {
  const out = document.getElementById('out');
  const text = document.getElementById('text').value;
  out.textContent = '// 请求中...';
  try {
    let url, opts;
    if (mode === 'types') {
      url = BASE + '/intent/types';
      opts = { headers: hdrs() };
    } else if (mode === 'detect') {
      // detect 的 text 是 query 参数(非 body)
      url = BASE + '/intent/detect?text=' + encodeURIComponent(text);
      opts = { method: 'POST', headers: hdrs() };
    } else {
      url = BASE + '/intent/' + mode;
      opts = { method: 'POST', headers: hdrs(), body: JSON.stringify({ text }) };
    }
    const r = await fetch(url, opts);
    const body = await r.text();
    out.textContent = r.status + ' ' + r.statusText + '\n' + body;
  } catch (e) {
    out.textContent = '// 请求失败: ' + e.message;
  }
}
</script>
</body>
</html>
