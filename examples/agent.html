<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 模块 — Agent 用例</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #0f172a; color: #e2e8f0; max-width: 800px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; color: #38bdf8; }
  .desc { background: #1e293b; border-left: 3px solid #38bdf8; padding: 12px 16px; border-radius: 4px; font-size: 13px; line-height: 1.7; }
  label { display: block; margin: 16px 0 6px; font-size: 13px; color: #94a3b8; }
  input, textarea { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 10px; font-size: 14px; }
  textarea { min-height: 70px; }
  button { background: #0284c7; border: none; color: #fff; padding: 10px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 14px; }
  pre { background: #0b1220; border: 1px solid #334155; border-radius: 6px; padding: 12px; white-space: pre-wrap; word-break: break-all; font-size: 13px; max-height: 360px; overflow: auto; }
</style>
</head>
<body>
<h1>Agent 模块 — /agent/*</h1>
<div class="desc">
  <b>测什么:</b>多轮 Agent 对话、记忆读写、工具列表、回访规划(followup)。<br>
  <b>前置:</b>X-API-Key(需 chat:write)。<br>
  <b>预期:</b>/chat 多轮保持上下文;/memory 返回该用户记忆;/tools 列出内置 Skill 工具;/followup 返回回访计划(有重要计划时)。
</div>

<label for="apiKey">X-API-Key</label>
<input id="apiKey" placeholder="cg_...">

<label for="text">消息</label>
<textarea id="text">帮我制定一个本周的 API 网关性能优化计划</textarea>

<div style="display:flex; gap:12px; flex-wrap:wrap;">
  <button onclick="call('chat')">POST /agent/chat</button>
  <button onclick="call('status')" style="background:#334155;">GET /agent/status</button>
  <button onclick="call('tools')" style="background:#334155;">GET /agent/tools</button>
  <button onclick="call('memory')" style="background:#334155;">GET /agent/memory/alice</button>
  <button onclick="call('followup')" style="background:#334155;">POST /agent/followup</button>
  <button onclick="call('health')" style="background:#334155;">GET /agent/health</button>
</div>

<pre id="out">// 结果将显示在这里</pre>

<script>
const BASE = 'http://localhost:8000';
function hdrs() {
  const k = document.getElementById('apiKey').value.trim();
  return { 'Content-Type': 'application/json', ...(k ? { 'X-API-Key': k } : {}) };
}
async function call(mode) {
  const out = document.getElementById('out');
  const text = document.getElementById('text').value;
  out.textContent = '// 请求中...';
  try {
    let url = BASE + '/agent/' + mode, opts = { headers: hdrs() };
    if (mode === 'chat') {
      opts.method = 'POST';
      opts.body = JSON.stringify({ message: text, session_id: 'agent-' + Date.now(), user_id: 'alice' });
    } else if (mode === 'followup') {
      opts.method = 'POST';
      opts.body = JSON.stringify({ user_id: 'alice' });
    }
    const r = await fetch(url, opts);
    out.textContent = r.status + ' ' + r.statusText + '\n' + (await r.text());
  } catch (e) { out.textContent = '// 请求失败: ' + e.message; }
}
</script>
</body>
</html>
