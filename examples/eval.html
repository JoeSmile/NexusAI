<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评测 — Evaluation 用例</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #0f172a; color: #e2e8f0; max-width: 800px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; color: #38bdf8; }
  .desc { background: #1e293b; border-left: 3px solid #38bdf8; padding: 12px 16px; border-radius: 4px; font-size: 13px; line-height: 1.7; }
  label { display: block; margin: 16px 0 6px; font-size: 13px; color: #94a3b8; }
  input, textarea { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 10px; font-size: 14px; }
  textarea { min-height: 70px; }
  button { background: #0284c7; border: none; color: #fff; padding: 10px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 14px; }
  pre { background: #0b1220; border: 1px solid #334155; border-radius: 6px; padding: 12px; white-space: pre-wrap; word-break: break-all; font-size: 13px; max-height: 360px; overflow: auto; }
</style>
</head>
<body>
<h1>评测 — /evaluation/*</h1>
<div class="desc">
  <b>测什么:</b>响应质量评测:evaluate 单条打分、batch 批量、compare-prompts 同请求多 prompt 对比(选优)。<br>
  <b>前置:</b>X-API-Key(chat:write);LLM 需真实 key(评测走 LLM 打分,LLM_MOCK=true 时结果无意义)。<br>
  <b>预期:</b>evaluate 返回 accuracy/naturalness/safety 三维评分+评语;compare-prompts 返回各 prompt 对比。
</div>

<label for="apiKey">X-API-Key</label>
<input id="apiKey" placeholder="cg_...">

<label for="question">问题</label>
<textarea id="question">如何查询公司的信息安全管理制度？</textarea>

<label for="answer">待评测回答</label>
<textarea id="answer">你可以通过内部 OA 系统的制度库查询,或在对话中直接问我,我会从已入库的知识库中检索相关制度条文。</textarea>

<div style="display:flex; gap:12px;">
  <button onclick="call('evaluate')">POST /evaluation/evaluate</button>
  <button onclick="call('compare')" style="background:#334155;">POST /evaluation/compare-prompts</button>
  <button onclick="call('list')" style="background:#334155;">GET /evaluation/list</button>
</div>

<pre id="out">// 结果将显示在这里</pre>

<script>
const BASE = 'http://localhost:8000';
function hdrs() {
  const k = document.getElementById('apiKey').value.trim();
  return { 'Content-Type': 'application/json', ...(k ? { 'X-API-Key': k } : {}) };
}
async function call(mode) {
  const out = document.getElementById('out');
  out.textContent = '// 请求中...';
  try {
    let url = BASE + '/evaluation/' + mode, opts = { headers: hdrs() };
    if (mode === 'evaluate') {
      opts.method = 'POST';
      opts.body = JSON.stringify({ user_message: document.getElementById('question').value, bot_response: document.getElementById('answer').value });
    } else if (mode === 'compare') {
      opts.method = 'POST';
      opts.body = JSON.stringify({
        user_message: document.getElementById('question').value,
        responses: {
          'prompt_a(企业严谨)': '根据知识库检索,信息安全管理制度可在 OA 制度库查询,或直接向我提问获取条文。',
          'prompt_b(通用助手)': '你可以查看公司内部制度文档,或者问我,我会尽力帮你找到相关信息。',
        },
      });
    }
    const r = await fetch(url, opts);
    out.textContent = r.status + ' ' + r.statusText + '\n' + (await r.text());
  } catch (e) { out.textContent = '// 请求失败: ' + e.message; }
}
</script>
</body>
</html>
