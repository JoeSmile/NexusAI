<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSE 流式 — Streaming 用例</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #0f172a; color: #e2e8f0; max-width: 800px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; color: #38bdf8; }
  .desc { background: #1e293b; border-left: 3px solid #38bdf8; padding: 12px 16px; border-radius: 4px; font-size: 13px; line-height: 1.7; }
  label { display: block; margin: 16px 0 6px; font-size: 13px; color: #94a3b8; }
  input, textarea { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 10px; font-size: 14px; }
  textarea { min-height: 70px; }
  button { background: #0284c7; border: none; color: #fff; padding: 10px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 14px; }
  button.stop { background: #b91c1c; }
  pre { background: #0b1220; border: 1px solid #334155; border-radius: 6px; padding: 12px; white-space: pre-wrap; word-break: break-all; font-size: 13px; max-height: 360px; overflow: auto; }
  .stat { color: #4ade80; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<h1>SSE 流式聊天 — /chat/streaming</h1>
<div class="desc">
  <b>测什么:</b>LangGraph 管线长路径的真流式输出:token 逐字推送、短路径(缓存/skill)返回 JSON、内容过滤 abort、超长 retraction。<br>
  <b>前置:</b>X-API-Key(需 chat:write);LLM_MOCK=true 时输出 mock 切片(逐字),false 时走真实模型 astream。<br>
  <b>预期:</b>事件流 <code>data: {"token":"..."}</code> 逐条到达,结尾 <code>data: [DONE]</code>;重复相同消息应命中缓存返回 JSON(非流式)。
</div>

<label for="apiKey">X-API-Key</label>
<input id="apiKey" placeholder="cg_...">

<label for="text">消息</label>
<textarea id="text">介绍一下 ContextGate 的架构</textarea>

<div style="display:flex; gap:12px;">
  <button onclick="start()">开始流式请求</button>
  <button class="stop" onclick="stop()">中止</button>
  <button onclick="clearOut()" style="background:#334155;">清空</button>
</div>
<div class="stat" id="stat"></div>
<pre id="out">// SSE 事件流将逐条显示</pre>

<script>
const BASE = 'http://localhost:8000';
let ctrl = null;
function hdrs() {
  const k = document.getElementById('apiKey').value.trim();
  return { 'Content-Type': 'application/json', ...(k ? { 'X-API-Key': k } : {}) };
}
async function start() {
  const out = document.getElementById('out');
  const stat = document.getElementById('stat');
  const text = document.getElementById('text').value;
  out.textContent = ''; stat.textContent = '';
  ctrl = new AbortController();
  const t0 = performance.now();
  let n = 0, aborted = false;
  try {
    const r = await fetch(BASE + '/chat/streaming', {
      method: 'POST', headers: hdrs(),
      body: JSON.stringify({ message: text, session_id: 'stream-' + Date.now(), user_id: 'alice' }),
      signal: ctrl.signal,
    });
    if (!r.ok) { out.textContent = r.status + ' ' + r.statusText + '\n' + await r.text(); return; }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n\n'); buf = lines.pop();
      for (const ev of lines) {
        if (!ev.startsWith('data:')) continue;
        n++;
        const payload = ev.slice(5).trim();
        out.textContent += payload + '\n';
        out.scrollTop = out.scrollHeight;
        if (payload === '[DONE]') { stat.textContent = '✓ 完成,事件数: ' + n + ',耗时: ' + Math.round(performance.now() - t0) + 'ms'; return; }
      }
    }
    stat.textContent = '✓ 连接关闭,事件数: ' + n;
  } catch (e) {
    aborted = e.name === 'AbortError';
    stat.textContent = aborted ? '⏹ 已中止(客户端断开,服务端应停止生成)' : '✗ 失败: ' + e.message;
  }
}
function stop() { if (ctrl) ctrl.abort(); }
function clearOut() { document.getElementById('out').textContent = ''; document.getElementById('stat').textContent = ''; }
</script>
</body>
</html>
