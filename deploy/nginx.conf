events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_status 429;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    upstream contextgate_upstream {
        server contextgate:8000;
    }

    upstream langfuse_upstream {
        server langfuse-web:3000;
    }

    server {
        listen 80;
        server_name contextgate.example.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name contextgate.example.com;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        client_max_body_size 20M;

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://contextgate_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /chat {
            proxy_pass http://contextgate_upstream/chat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /langfuse/ {
            proxy_pass http://langfuse_upstream/;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://contextgate_upstream/health;
        }

        location /metrics/ {
            proxy_pass http://contextgate_upstream/metrics/;
        }

        error_page 429 /429.html;
        location = /429.html {
            default_type text/plain;
            return 429 "Rate limit exceeded\n";
        }

        error_page 502 /502.html;
        location = /502.html {
            default_type text/plain;
            return 502 "Service temporarily unavailable\n";
        }
    }
}
