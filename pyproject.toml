[project]
name = "nexus-ai"
version = "1.0.0"
description = "The Governance Hub for Enterprise AI — 企业 AI 中台"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Commercial License"}
authors = [
    {name = "Joe"}
]
keywords = ["llm-gateway", "context-management", "observability", "ai-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

# 核心框架
dependencies = [
    # 核心框架 (pydantic v2)
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0,<3.0.0",
    "python-dotenv>=0.20.0",
    "requests>=2.25.0",
    # LLM和LangChain
    "openai>=1.26.0,<2.0.0",
    "langchain>=0.2.0,<0.3.0",
    "langchain-openai>=0.1.10,<0.2.0",
    "langchain-community>=0.0.1,<0.3.0",
    "langchain-core>=0.2.43,<0.3.0",
    "langchain-text-splitters>=0.2.0,<0.3.0",
    "langgraph>=0.2.0,<0.3.0",
    "langfuse>=4.7.0,<5",
    "pandas>=2.0.0",
    # 数据库 (PostgreSQL + pgvector)
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0,<0.4.0",
    "sqlalchemy>=1.4.0,<2.0.0",
    "alembic>=1.8.0",
    # 文档处理
    "python-multipart>=0.0.9",
    "pypdf>=3.0.0",
    "python-docx>=1.1.0",
    "PyPDF2>=2.0.0",
    # 依赖冲突修复
    "idna>=2.10",
    "anyio>=3.0.0",
    "sniffio>=1.3.0",
    "httpx>=0.27.0,<0.29.0",
    "protobuf>=4.25.0,<6.0.0",
    # 轻量工具
    "Pillow>=9.0.0",
    "jieba>=0.42.1",
    "beautifulsoup4>=4.9.0",
    "feedparser>=5.2.0",
    "typing-extensions>=4.0.0",
    "numpy>=1.21.0",
    "prometheus-client>=0.17.0",
    "pyyaml>=6.0",
    "cryptography>=49.0.0",
    "pydantic-settings>=2.14.2",
    "redis>=4.5.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "openpyxl>=3.1.5",
    "mcp>=1.0.0",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
# 可选依赖（保留用于兼容性，推荐使用 dependency-groups）
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
# 多模态提取（Task 21.02）— 未安装时 /api/rag/upload 返回 RAG_001
# 安装: uv sync --extra multimodal
multimodal = [
    "faster-whisper>=1.0.0",
    "openai-whisper>=20230314",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
    "soundfile>=0.12.0",
]
# 工具混合检索本地向量（Task 60）— 未安装时用 hash 兜底
# 安装: uv sync --extra tool-search
tool-search = [
    "sentence-transformers>=2.2.0",
]
# 意图 BERT v8（Task 65 slice 9）— 未安装或未部署模型时回退规则引擎
# 安装: uv sync --extra intent-model
# 默认 CPU 轮子（无 nvidia-*）；有 GPU 后再改 [tool.uv.sources] → pytorch-cu* 并重建镜像
intent-model = [
    "transformers>=4.46.0,<5",
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/JoeSmile/NexusAI"
Documentation = "https://github.com/JoeSmile/NexusAI#readme"
Repository = "https://github.com/JoeSmile/NexusAI"
Issues = "https://github.com/JoeSmile/NexusAI/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# 应用仓库：不打包安装项目本身，只同步依赖
package = false

[tool.hatch.build.targets.wheel]
packages = ["backend", "packages", "apps"]

# PyTorch 索引：默认 CPU（档位 A/无 GPU 服务器）。切 GPU 时：
#   1) 把下面 torch 的 index 改成 pytorch-cu128（或当期 CUDA 版）
#   2) uv lock --extra intent-model && 重建 Docker 镜像
#   3) config.env 设 INTENT_DEVICE=cuda（或 auto）
# 文档: https://docs.astral.sh/uv/guides/integration/pytorch/
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# 预留：用户量上来、机器有 NVIDIA 时启用（取消注释并改 sources）
# [[tool.uv.index]]
# name = "pytorch-cu128"
# url = "https://download.pytorch.org/whl/cu128"
# explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
# 开发依赖组（替代已弃用的 tool.uv.dev-dependencies）
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.16+ 默认规则过宽（含 BLE/DTZ/RUF 中文标点等）；显式收敛为可维护门禁
select = [
  "E4", "E7", "E9", # pycodestyle (selected)
  "F",              # Pyflakes
  "I",              # isort
  "UP",             # pyupgrade
  "B",              # flake8-bugbear
]
ignore = [
  "E501", # line length — formatter / 中文注释
  "B008", # FastAPI Depends() in defaults — idiomatic
  "B904", # raise without from — legacy noise
  "E402", # import not at top — dotenv / sys.path bootstrap
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402", "B", "F401", "UP035"]
# Message/Conversation ORM 已移除，遗留 agent hub 待后续退役
"packages/agent_runtime/memory_hub.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = false
follow_imports = "silent"
# 存量类型债务巨大(删 plugins 后暴露 ~760)。门禁严查 NexusAI 主路径。
files = [
  "packages/pipeline",
  "packages/skills",
  "packages/observability",
  "packages/auth",
  "packages/guardrails",
  "packages/harness",
  "packages/memory",
  "packages/social",
  "packages/rate_limiter.py",
  "packages/metrics.py",
  "packages/cost_manager.py",
  "packages/errors.py",
  "packages/tenant.py",
  "packages/health.py",
  "packages/circuit_breaker.py",
  "packages/key_manager.py",
  "packages/key_health.py",
  "packages/key_repository.py",
  "apps/api/app.py",
  "apps/api/routers/admin.py",
  "apps/api/routers/audit.py",
  "apps/api/routers/files.py",
  "apps/api/routers/agent.py",
  "apps/api/routers/evaluation.py",
  "apps/api/routers/personalization.py",
  "apps/api/routers/performance.py",
  "apps/api/routers/memory.py",
  "apps/api/routers/feedback.py",
  "apps/api/routers/social.py",
  "packages/intent",
  "packages/rag",
  "packages/agent",
  "packages/llm",
  "packages/notification",
  "packages/channel",
  "packages/workflow",
  "packages/skill_assets",
  "apps/api/routers/workflow_runs.py",
  "apps/api/routers/workflows.py",
  "apps/api/routers/workflow_approvals.py",
  "apps/api/routers/channel_webhooks.py",
]

# 遗留模块类型债巨大 — 纳入 files 扫描范围，但对这些包忽略错误，避免放宽全局策略
[[tool.mypy.overrides]]
module = [
  "packages.rag.*",
  "packages.llm.*",
  "packages.intent.core.enhanced_input_processor",
  "packages.intent.core.input_processor",
]
ignore_errors = true

