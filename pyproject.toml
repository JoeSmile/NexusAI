[project]
name = "context-gate"
version = "3.0.0"
description = "The Intelligent Gateway for LLM Context Management"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Joe"}
]
keywords = ["llm-gateway", "context-management", "observability", "ai-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 核心框架
dependencies = [
    # 核心框架 (pydantic v2)
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0,<3.0.0",
    "python-dotenv>=0.20.0",
    "requests>=2.25.0",
    # LLM和LangChain
    "openai>=1.26.0,<2.0.0",
    "langchain>=0.2.0,<0.3.0",
    "langchain-openai>=0.1.10,<0.2.0",
    "langchain-community>=0.0.1,<0.3.0",
    "langgraph>=0.2.0,<0.3.0",
    "langfuse>=2.0.0,<3.0.0",
    "pandas>=2.0.0",
    # 数据库 (PostgreSQL + pgvector)
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0,<0.4.0",
    "sqlalchemy>=1.4.0,<2.0.0",
    "alembic>=1.8.0",
    # 文档处理
    "python-multipart>=0.0.9",
    "pypdf>=3.0.0",
    "PyPDF2>=2.0.0",
    # 依赖冲突修复
    "idna>=2.10",
    "anyio>=3.0.0",
    "sniffio>=1.3.0",
    "httpx>=0.27.0,<0.29.0",
    "protobuf>=4.25.0,<6.0.0",
    # 轻量工具
    "Pillow>=9.0.0",
    "jieba>=0.42.1",
    "beautifulsoup4>=4.9.0",
    "feedparser>=5.2.0",
    "typing-extensions>=4.0.0",
    "numpy>=1.21.0",
    "prometheus-client>=0.17.0",
    "pyyaml>=6.0",
    "cryptography>=49.0.0",
]

[project.optional-dependencies]
# 可选依赖（保留用于兼容性，推荐使用 dependency-groups）
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
# 旧多模态能力（会拉 tensorflow，macOS/arm64 常装不上；需要时: uv sync --extra multimodal）
multimodal = [
    "openai-whisper>=20230314",
    "pydub>=0.25.1",
    "noisereduce>=2.0.0",
    "librosa>=0.9.0",
    "soundfile>=0.12.0",
    "opencv-python>=4.5.0",
    "deepface>=0.0.79",
    "face-recognition>=1.3.0",
    "pytesseract>=0.3.10",
    "gTTS>=2.5.0",
    "aliyun-python-sdk-core>=2.15.0",
    "aliyun-python-sdk-imageprocess>=2.0.0",
    "aliyun-python-sdk-ocr>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/joe/context-gate"
Documentation = "https://github.com/joe/context-gate#readme"
Repository = "https://github.com/joe/context-gate"
Issues = "https://github.com/joe/context-gate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# 应用仓库：不打包安装项目本身，只同步依赖
package = false

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv.sources]
# 可以在这里指定自定义源，例如阿里云镜像
# 注意：uv 默认使用官方 PyPI，如需使用镜像源，可以在命令行使用 --index-url

[dependency-groups]
# 开发依赖组（替代已弃用的 tool.uv.dev-dependencies）
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.16+ 默认规则过宽（含 BLE/DTZ/RUF 中文标点等）；显式收敛为可维护门禁
select = [
  "E4", "E7", "E9", # pycodestyle (selected)
  "F",              # Pyflakes
  "I",              # isort
  "UP",             # pyupgrade
  "B",              # flake8-bugbear
]
ignore = [
  "E501", # line length — formatter / 中文注释
  "B008", # FastAPI Depends() in defaults — idiomatic
  "B904", # raise without from — legacy noise
  "E402", # import not at top — dotenv / sys.path bootstrap
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402", "B", "F401", "UP035"]
"backend/tests/**" = ["F401", "F811", "UP035"]
# Message/Conversation ORM 已移除，遗留 agent hub 待后续退役
"backend/modules/agent/core/agent/memory_hub.py" = ["F821", "E722"]
"backend/agent/memory_hub.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = false
follow_imports = "silent"
# 存量类型债务巨大（删 plugins 后暴露 ~760）。门禁严查 ContextGate 主路径。
files = [
  "backend/pipeline",
  "backend/skills",
  "backend/observability",
  "backend/core/auth",
  "backend/core/guardrails",
  "backend/core/harness",
  "backend/core/rate_limiter.py",
  "backend/core/metrics.py",
  "backend/core/cost_manager.py",
  "backend/core/errors.py",
  "backend/core/tenant.py",
  "backend/core/health.py",
  "backend/core/circuit_breaker.py",
  "backend/core/key_manager.py",
  "backend/core/key_repository.py",
  "backend/core/key_health.py",
  "backend/app.py",
  "backend/routers/admin.py",
  "backend/routers/audit.py",
  "backend/routers/files.py",
]

